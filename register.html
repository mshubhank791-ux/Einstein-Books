<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Einstein Books - Student Registration</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f8fafc;
            margin: 0;
            padding: 40px 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: rgba(30, 41, 59, 0.82);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 420px;
        }

        h2 {
            color: #38bdf8;
            margin-top: 0;
            text-align: center;
            font-size: 26px;
        }

        h2 span {
            color: #f59e0b;
        }

        h3 {
            color: #94a3b8;
            margin-top: 5px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: #cbd5e1;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
        }

        button {
            background-color: #f59e0b;
            color: #0f172a;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background-color: #d97706;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 20px;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Einstein <span>Books</span> 📚</h2>
        <h3>Student Registration</h3>

        <hr>

        <form id="regForm" onsubmit="return validateForm(event)">
            <label>Full Name :</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>Age :</label>
            <input type="number" id="age" placeholder="Enter your age" required>

            <label>Select Course / Class :</label>
            <select id="course" required>
                <option value="">-- Choose Course --</option>
                <option value="B.Sc Computer Science & Physics">B.Sc Computer Science & Physics</option>
                <option value="B.Tech Engineering">B.Tech Engineering</option>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select>

            <label>City :</label>
            <input type="text" id="city" placeholder="Enter your city" required>

            <label>Email Address :</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Create Password :</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <button type="submit">Register Account</button>
        </form>

        <hr>

        <footer>
            <p>Already registered? <a href="login.html">Login here</a></p>
            <p>&copy; 2026 Einstein Books</p>
        </footer>
    </div>

    <script>
        async function validateForm(event) {
            if (event) event.preventDefault();

            const formData = {
                name: document.getElementById("name").value.trim(),
                age: document.getElementById("age").value.trim(),
                course: document.getElementById("course").value,
                city: document.getElementById("city").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                alert(result.message);

                if (result.success) {
                    window.location.href = "login.html";
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Could not connect to server. Make sure server.js is running!");
            }

            return false;
        }
    </script>
</body>
</html>
