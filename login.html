<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Einstein Books - Student Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: rgba(30, 41, 59, 0.82);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            width: 400px;
        }

        h2 {
            color: #38bdf8;
            margin-top: 0;
            text-align: center;
            font-size: 26px;
        }

        h2 span {
            color: #f59e0b;
        }

        h3 {
            color: #94a3b8;
            margin-top: 5px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
        }

        hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 20px;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Einstein <span>Books</span> 📚</h2>
        <h3>Member Sign In</h3>

        <hr>

        <form onsubmit="return validateLogin(event)">
            <label>Email Address :</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label>Password :</label>
            <input type="password" id="loginPassword" placeholder="Enter password" required>

            <button type="submit">Access Dashboard</button>
        </form>

        <hr>

        <footer>
            <p>New Student? <a href="register.html">Register here</a></p>
            <p>&copy; 2026 Einstein Books</p>
        </footer>
    </div>

    <script>
        async function validateLogin(event) {
            if (event) event.preventDefault();

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (result.success) {
                    alert("Login Successful! Welcome to Einstein Books.");
                    
                    sessionStorage.setItem("studentName", result.student.name);
                    sessionStorage.setItem("savedEmail", result.student.email);
                    sessionStorage.setItem("studentCity", result.student.city);

                    window.location.href = "dashboard.html";
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Could not connect to server. Check server.js.");
            }

            return false;
        }
    </script>
</body>
</html>
