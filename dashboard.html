<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Einstein Books - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: #38bdf8;
            font-weight: 700;
        }

        header h1 span {
            color: #f59e0b;
        }

        .header-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-nav a, .header-nav button {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .header-nav a:hover, .header-nav button:hover {
            color: #38bdf8;
        }

        .logout-btn {
            background-color: #ef4444 !important;
            color: white !important;
            padding: 7px 16px;
            border-radius: 6px;
            font-weight: bold;
        }
        .logout-btn:hover { background-color: #dc2626 !important; }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 50px 40px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-content {
            max-width: 1150px;
            margin: 0 auto;
        }

        .hero p.eyebrow {
            color: #38bdf8;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .hero h2 {
            font-size: 36px;
            margin: 0 0 10px 0;
        }

        .hero p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .explore-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 22px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s, transform 0.2s;
        }
        .explore-btn:hover { background-color: #0ea5e9; transform: translateY(-2px); }

        /* Main Layout */
        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
        }

        /* Filter Taskbar */
        .taskbar {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 18px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .taskbar label {
            font-weight: bold;
            color: #38bdf8;
            font-size: 15px;
        }

        .taskbar select {
            flex: 1;
            padding: 12px 18px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
        }
        .taskbar select:focus { border-color: #38bdf8; }

        /* Interactive Book Cards Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .book-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .book-card:hover {
            transform: translateY(-8px);
            border-color: #38bdf8;
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.25);
        }

        .book-img-container {
            width: 100%;
            height: 240px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .book-img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-radius: 6px;
            transition: transform 0.3s ease;
        }

        .book-card:hover .book-img-container img {
            transform: scale(1.06);
        }

        .book-content {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tag {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .book-card h3 {
            margin: 0 0 6px 0;
            font-size: 16px;
            color: #f1f5f9;
            line-height: 1.3;
        }

        .author {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            margin-top: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
        }

        .btn-add {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-add:hover { background-color: #0ea5e9; transform: scale(1.05); }

        /* Cart Panel Section */
        .cart-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .cart-panel h3 {
            margin-top: 0;
            font-size: 22px;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        ul#cartList {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }

        ul#cartList li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #f1f5f9;
        }

        .remove-btn {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .remove-btn:hover { background-color: rgba(239, 68, 68, 0.4); }

        .checkout-btn {
            background-color: #22c55e;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s, transform 0.2s;
        }

        .checkout-btn:hover { background-color: #16a34a; transform: translateY(-2px); }

        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 50px;
            background: rgba(15, 23, 42, 0.9);
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <h1>Einstein <span>Books</span></h1>
        <div class="header-nav">
            <a href="#">Home</a>
            <a href="#bookSection">Explore</a>
            <a href="#cartSection">Cart</a>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero">
        <div class="hero-content">
            <p class="eyebrow">Welcome to the Academic Library</p>
            <h2>Your next chapter<br>starts here.</h2>
            <p>Explore authoritative physics, mathematics, and computer science textbooks.</p>
            <button class="explore-btn" onclick="scrollToBooks()">Explore Books</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">

        <!-- Category Taskbar Selector -->
        <div class="taskbar" id="bookSection">
            <label for="categorySelect">📚 Filter Subject:</label>
            <select id="categorySelect" onchange="filterByCategory()">
                <option value="ALL">All Core Subjects (Physics, Math, Computer Science)</option>
                <option value="PHYSICS">Physics Textbooks</option>
                <option value="MATHEMATICS">Mathematics Textbooks</option>
                <option value="COMPUTER SCIENCE">Computer Science & Coding</option>
            </select>
        </div>

        <!-- Books Grid Container -->
        <div id="bookGrid" class="grid-container"></div>

        <!-- Shopping Cart Panel -->
        <div id="cartSection" class="cart-panel">
            <h3>🛒 Shopping Cart</h3>
            <ul id="cartList">
                <li>Your cart is currently empty.</li>
            </ul>
            <div style="font-size: 19px; font-weight: bold; color: #f8fafc; margin-top: 15px;">
                Total Amount: ₹<span id="totalPrice" style="color: #4ade80;">0</span>
            </div>
            <button onclick="checkout()" class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>

    <footer>
        <p>© 2026 Einstein Books. Empowering academic learning.</p>
    </footer>

    <script>
        const universityBooks = [
            // PHYSICS BOOKS (Direct reliable cover image links)
            { id: 1, category: "PHYSICS", title: "Classical Mechanics", author: "Herbert Goldstein", price: 750, image: "https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=600&auto=format&fit=crop" },
            { id: 2, category: "PHYSICS", title: "Concepts of Physics (Vol 1)", author: "H.C. Verma", price: 680, image: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=600&auto=format&fit=crop" },
            { id: 3, category: "PHYSICS", title: "Quantum Mechanics", author: "Nouredine Zettili", price: 890, image: "https://images.unsplash.com/photo-1507413245164-6160d8298b31?q=80&w=600&auto=format&fit=crop" },
            { id: 4, category: "PHYSICS", title: "Introduction to Electrodynamics", author: "David J. Griffiths", price: 790, image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=600&auto=format&fit=crop" },

            // MATHEMATICS BOOKS
            { id: 5, category: "MATHEMATICS", title: "Higher Engineering Math", author: "B.S. Grewal", price: 850, image: "https://images.unsplash.com/photo-1509228468518-180dd4864904?q=80&w=600&auto=format&fit=crop" },
            { id: 6, category: "MATHEMATICS", title: "Linear Algebra & Its Apps", author: "Gilbert Strang", price: 720, image: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?q=80&w=600&auto=format&fit=crop" },
            { id: 7, category: "MATHEMATICS", title: "Calculus (Vol. 1)", author: "Tom M. Apostol", price: 950, image: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=600&auto=format&fit=crop" },
            { id: 8, category: "MATHEMATICS", title: "Discrete Mathematics", author: "Kenneth H. Rosen", price: 780, image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop" },

            // COMPUTER SCIENCE BOOKS
            { id: 9, category: "COMPUTER SCIENCE", title: "Introduction to Algorithms", author: "Cormen, Leiserson (CLRS)", price: 990, image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=600&auto=format&fit=crop" },
            { id: 10, category: "COMPUTER SCIENCE", title: "Data Structures Using C", author: "Reema Thareja", price: 540, image: "https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=600&auto=format&fit=crop" },
            { id: 11, category: "COMPUTER SCIENCE", title: "Operating System Concepts", author: "Silberschatz & Galvin", price: 880, image: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=600&auto=format&fit=crop" },
            { id: 12, category: "COMPUTER SCIENCE", title: "Clean Code", author: "Robert C. Martin", price: 650, image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=600&auto=format&fit=crop" }
        ];

        let cart = [];

        window.onload = function() {
            renderBooks(universityBooks);
        };

        function renderBooks(books) {
            const grid = document.getElementById("bookGrid");
            grid.innerHTML = books.map(book => `
                <div class="book-card">
                    <div class="book-img-container">
                        <img src="${book.image}" alt="${book.title}" onerror="this.src='https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=600&auto=format&fit=crop'">
                    </div>
                    <div class="book-content">
                        <div>
                            <span class="tag">${book.category}</span>
                            <h3>${book.title}</h3>
                            <div class="author">By ${book.author}</div>
                        </div>
                        <div class="price-row">
                            <div class="price">₹${book.price}</div>
                            <button class="btn-add" onclick="addToCart('${book.title}', ${book.price})">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterByCategory() {
            const selectedCategory = document.getElementById("categorySelect").value;
            if (selectedCategory === "ALL") {
                renderBooks(universityBooks);
            } else {
                const filtered = universityBooks.filter(b => b.category === selectedCategory);
                renderBooks(filtered);
            }
        }

        function scrollToBooks() {
            document.getElementById("bookSection").scrollIntoView({ behavior: 'smooth' });
        }

        function addToCart(title, price) {
            cart.push({ title, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const cartList = document.getElementById("cartList");
            const totalPriceEl = document.getElementById("totalPrice");
            let totalAmount = 0;

            if (cart.length === 0) {
                cartList.innerHTML = "<li>Your cart is currently empty.</li>";
            } else {
                cartList.innerHTML = cart.map((item, index) => {
                    totalAmount += item.price;
                    return `
                        <li>
                            <span>${item.title}</span>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <strong style="color: #4ade80;">₹${item.price}</strong>
                                <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                            </div>
                        </li>
                    `;
                }).join('');
            }
            totalPriceEl.innerText = totalAmount;
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Your shopping cart is empty!");
                return;
            }
            alert("Order Placed Successfully at Einstein Books!\nThank you for shopping.");
            cart = [];
            updateCartUI();
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
